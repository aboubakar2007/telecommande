# Compile l'application iOS sur un Mac GitHub et produit un .ipa NON signé.
# L'IPA est ensuite signé et installé sur l'iPhone avec Sideloadly (Apple ID gratuit).
name: Build iOS IPA (non signé)

on:
  workflow_dispatch:        # lancement manuel depuis l'onglet "Actions"
  push:
    tags: ['v*']            # ou automatiquement sur un tag v0.x.x

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Tests
        run: flutter test

      - name: Build iOS (sans signature)
        run: flutter build ios --release --no-codesign

      - name: Empaquetage en .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr FamilyRemote.ipa Payload
          ls -lh FamilyRemote.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: FamilyRemote-ipa
          path: FamilyRemote.ipa
          retention-days: 14
